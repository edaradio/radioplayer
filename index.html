<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio — edas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1612">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radio edas">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0E0C0A;
    --panel:  #1A1612;
    --warm:   #2A2420;
    --cream:  #F5F0E8;
    --muted:  #7A6E62;
    --accent: #C45C2A;
    --accent2:#E8835A;
    --rule:   rgba(245,240,232,0.08);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--cream);
    font-family: 'DM Mono', monospace;
  }

  /* Grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 200;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  /* ── Loading ── */
  #loading-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2rem; z-index: 300;
    transition: opacity 0.5s;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  .load-title {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem; font-weight: 700;
    color: var(--cream);
  }
  .load-title span { color: var(--accent); font-style: italic; }

  .load-bar-wrap {
    width: 280px; height: 3px;
    background: var(--rule); border-radius: 2px; overflow: hidden;
  }
  .load-bar {
    height: 100%; background: var(--accent);
    border-radius: 2px; width: 0%; transition: width 0.3s ease;
  }
  .load-msg { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.12em; }

  #error-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1rem; z-index: 300; padding: 2rem; text-align: center;
  }
  #error-screen h2 { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 2rem; }
  #error-screen p { font-size: 0.85rem; color: var(--muted); max-width: 480px; line-height: 1.7; }

  /* ── Main Layout ── */
  #app {
    width: 100vw; height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    grid-template-columns: 1fr 420px;
    grid-template-areas:
      "nowplaying playlist"
      "controls   playlist";
  }

  /* ── Now Playing ── */
  #now-playing {
    grid-area: nowplaying;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 5vh 6vw 3vh;
    gap: 1.5rem;
  }

  .np-eyebrow {
    font-size: 0.7rem; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--accent);
  }

  .np-disc-wrap {
    display: flex; align-items: center; gap: 3vw;
  }

  .np-disc {
    width: clamp(120px, 14vw, 200px);
    height: clamp(120px, 14vw, 200px);
    border-radius: 50%;
    background: conic-gradient(
      #1A1612 0deg 10deg, #2e2620 10deg 25deg,
      #1A1612 25deg 40deg, #2e2620 40deg 60deg,
      #1A1612 60deg 75deg, #2e2620 75deg 100deg,
      #1A1612 100deg 115deg, #2e2620 115deg 140deg,
      #1A1612 140deg 155deg, #2e2620 155deg 180deg,
      #1A1612 180deg 195deg, #2e2620 195deg 220deg,
      #1A1612 220deg 235deg, #2e2620 235deg 260deg,
      #1A1612 260deg 275deg, #2e2620 275deg 300deg,
      #1A1612 300deg 315deg, #2e2620 315deg 340deg,
      #1A1612 340deg 355deg, #2e2620 355deg 360deg
    );
    position: relative; flex-shrink: 0;
    animation: spin 8s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 0 60px rgba(196,92,42,0.15), 0 8px 32px rgba(0,0,0,0.5);
  }
  .np-disc.playing { animation-play-state: running; }
  .np-disc::after {
    content: ''; position: absolute; inset: 30%;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 20px rgba(196,92,42,0.4);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .np-text { flex: 1; min-width: 0; }

  #np-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3.5vw, 3.2rem);
    font-weight: 700; line-height: 1.15;
    letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #np-index {
    font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem;
    letter-spacing: 0.05em;
  }

  /* Progress — NOT focusable via D-pad */
  .progress-area {
    display: flex; flex-direction: column; gap: 0.5rem;
    pointer-events: none; /* TV remote can't accidentally focus this */
  }

  .progress-track {
    width: 100%; height: 4px;
    background: var(--rule); border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--accent);
    border-radius: 2px; width: 0%; transition: width 0.5s linear;
  }

  .time-row {
    display: flex; justify-content: space-between;
    font-size: 0.72rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── Controls ── */
  #controls {
    grid-area: controls;
    padding: 2vh 6vw 4vh;
    display: flex; align-items: center; gap: 1.5vw;
  }

  .tv-btn {
    background: var(--warm);
    border: 2px solid var(--rule);
    border-radius: 16px;
    color: var(--cream);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 0.6rem;
    font-family: 'DM Mono', monospace;
    font-size: clamp(1rem, 1.8vw, 1.4rem);
    padding: 0.9rem 2rem;
    transition: all 0.15s;
    outline: none;
    white-space: nowrap;
  }

  .tv-btn:focus, .tv-btn.focused {
    background: var(--accent);
    border-color: var(--accent2);
    color: white;
    transform: scale(1.06);
    box-shadow: 0 0 0 4px rgba(196,92,42,0.3), 0 8px 24px rgba(196,92,42,0.25);
  }

  .tv-btn:active { transform: scale(0.97); }

  .tv-btn-play {
    padding: 1rem 3rem;
    font-size: clamp(1.1rem, 2vw, 1.6rem);
    background: var(--accent);
    border-color: var(--accent);
  }
  .tv-btn-play:focus, .tv-btn-play.focused {
    background: var(--accent2);
    border-color: var(--cream);
    box-shadow: 0 0 0 4px rgba(245,240,232,0.2), 0 8px 24px rgba(196,92,42,0.4);
  }

  .tv-btn-shuffle.on {
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* ── Playlist ── */
  #playlist-panel {
    grid-area: playlist;
    border-left: 1px solid var(--rule);
    display: flex; flex-direction: column;
    background: var(--panel);
    overflow: hidden;
  }

  .pl-header {
    padding: 2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 0.75rem;
  }

  .pl-title {
    font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--accent);
  }

  .pl-search {
    display: flex; align-items: center; gap: 0.6rem;
    background: var(--warm); border: 1px solid var(--rule);
    border-radius: 8px; padding: 0.5rem 0.75rem;
  }
  .pl-search span { color: var(--muted); font-size: 0.85rem; }
  .pl-search input {
    background: none; border: none; outline: none;
    color: var(--cream); font-family: 'DM Mono', monospace;
    font-size: 0.8rem; flex: 1;
  }
  .pl-search input::placeholder { color: var(--muted); }

  .pl-count {
    font-size: 0.68rem; color: var(--muted); letter-spacing: 0.05em;
  }

  .pl-list {
    flex: 1; overflow-y: auto; padding: 0.5rem 0;
    scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  }
  .pl-list::-webkit-scrollbar { width: 3px; }
  .pl-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

  .song-row {
    display: flex; align-items: center;
    padding: 0.65rem 1.5rem; gap: 0.75rem;
    cursor: pointer; transition: background 0.1s;
    border-left: 3px solid transparent;
  }
  .song-row:hover { background: var(--warm); }
  .song-row.active {
    background: var(--warm);
    border-left-color: var(--accent);
  }
  .song-row.active .song-name { color: var(--accent2); }
  .song-row.active .song-num { color: var(--accent); }

  .song-num {
    font-size: 0.65rem; color: var(--muted);
    min-width: 2rem; text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .song-name {
    font-size: 0.82rem; color: var(--cream); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .now-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    opacity: 0; transition: opacity 0.2s;
  }
  .song-row.active .now-dot {
    opacity: 1; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.2} }

  /* ── Responsive: phone/tablet ── */
  @media (max-width: 900px) {
    #app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr;
      grid-template-areas: "nowplaying" "controls" "playlist";
      overflow-y: auto; height: auto; min-height: 100vh;
    }
    #playlist-panel { border-left: none; border-top: 1px solid var(--rule); height: 50vh; }
    .np-disc { width: 100px; height: 100px; }
    #np-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="load-title">Radio <span>edas</span></div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-msg" id="load-msg">Connecting to library…</div>
</div>

<div id="error-screen">
  <h2>Couldn't load library</h2>
  <p id="error-msg">Problem connecting to Google Drive. Check the folder is shared publicly and the API key is valid.</p>
</div>

<!-- App -->
<div id="app">

  <section id="now-playing">
    <div class="np-eyebrow">Now Playing</div>
    <div class="np-disc-wrap">
      <div class="np-disc" id="disc"></div>
      <div class="np-text">
        <div id="np-title">Loading…</div>
        <div id="np-index"></div>
      </div>
    </div>
    <div class="progress-area" aria-hidden="true">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-tot">0:00</span>
      </div>
    </div>
  </section>

  <nav id="controls" aria-label="Playback controls">
    <button class="tv-btn" id="btn-prev" tabindex="1" aria-label="Previous">&#9664;&#9664; Prev</button>
    <button class="tv-btn tv-btn-play" id="btn-play" tabindex="2" aria-label="Play or Pause">&#9654; Play</button>
    <button class="tv-btn" id="btn-next" tabindex="3" aria-label="Next">Next &#9654;&#9654;</button>
    <button class="tv-btn tv-btn-shuffle on" id="btn-shuffle" tabindex="4" aria-label="Toggle shuffle">&#x21C4; Shuffle</button>
  </nav>

  <aside id="playlist-panel">
    <div class="pl-header">
      <div class="pl-title">Library</div>
      <div class="pl-search">
        <span>&#128269;</span>
        <input type="text" id="search" placeholder="Search…" tabindex="5" aria-label="Search songs">
      </div>
      <div class="pl-count" id="pl-count">Loading…</div>
    </div>
    <div class="pl-list" id="pl-list" role="list"></div>
  </aside>

</div>

<!-- Hidden video keep-alive -->
<video id="video-keepalive" muted playsinline loop autoplay
  style="position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;top:0;left:0;"
  aria-hidden="true"></video>
<audio id="audio" preload="metadata"></audio>

<script>
// ── Config ──────────────────────────────
const API_KEY   = 'AIzaSyD6AbH1UySSj6CFTnYtbDeITS6uxPWVOOg';
const FOLDER_ID = '1CU5LwjND6Yt0NIIPX1fo7pbGoUbNbDUC';
// ────────────────────────────────────────

const loadScreen  = document.getElementById('loading-screen');
const loadBar     = document.getElementById('load-bar');
const loadMsg     = document.getElementById('load-msg');
const errScreen   = document.getElementById('error-screen');
const errMsg      = document.getElementById('error-msg');

function setLoad(pct, msg) { loadBar.style.width = pct + '%'; loadMsg.textContent = msg; }
function showErr(msg) { loadScreen.style.display='none'; errScreen.style.display='flex'; errMsg.textContent=msg; }

async function fetchAllFiles() {
  let files = [], pageToken = null;
  const base = 'https://www.googleapis.com/drive/v3/files';
  do {
    const p = new URLSearchParams({
      key: API_KEY,
      q: `'${FOLDER_ID}' in parents and mimeType contains 'audio' and trashed = false`,
      fields: 'nextPageToken, files(id, name)',
      pageSize: 1000, orderBy: 'name'
    });
    if (pageToken) p.set('pageToken', pageToken);
    const res = await fetch(`${base}?${p}`);
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'Drive API error'); }
    const data = await res.json();
    files = files.concat(data.files || []);
    pageToken = data.nextPageToken || null;
    setLoad(30 + Math.min(files.length / 4, 40), `Found ${files.length} songs…`);
  } while (pageToken);
  return files;
}

function streamUrl(id) { return `https://www.googleapis.com/drive/v3/files/${id}?alt=media&key=${API_KEY}`; }
function label(name) { return name.replace(/\.(mp3|MP3|m4a|ogg|flac|wav)$/i,'').replace(/([A-Z])/g,' $1').trim(); }
function fmt(s) { s=Math.floor(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function shuffleArr(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }

// ── State ──
let allFiles=[], playlist=[], currentIdx=0, isPlaying=false, shuffleOn=true, searchTerm='';

const audio      = document.getElementById('audio');
const disc       = document.getElementById('disc');
const npTitle    = document.getElementById('np-title');
const npIndex    = document.getElementById('np-index');
const progFill   = document.getElementById('progress-fill');
const timeCur    = document.getElementById('time-cur');
const timeTot    = document.getElementById('time-tot');
const btnPlay    = document.getElementById('btn-play');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');
const btnShuffle = document.getElementById('btn-shuffle');
const plList     = document.getElementById('pl-list');
const plCount    = document.getElementById('pl-count');
const searchEl   = document.getElementById('search');

// ── D-pad focus management ──
// Only these buttons are in the D-pad tab order — progress bar is excluded
const focusable = [btnPrev, btnPlay, btnNext, btnShuffle, searchEl];
let focusIdx = 1; // start on Play

function setFocus(idx) {
  focusIdx = Math.max(0, Math.min(focusable.length - 1, idx));
  focusable.forEach((el, i) => el.classList.toggle('focused', i === focusIdx));
  focusable[focusIdx].focus();
}

document.addEventListener('keydown', e => {
  // Let search input handle its own typing
  if (document.activeElement === searchEl && e.key !== 'Escape') return;

  switch(e.key) {
    case 'ArrowLeft':  e.preventDefault(); setFocus(focusIdx - 1); break;
    case 'ArrowRight': e.preventDefault(); setFocus(focusIdx + 1); break;
    case 'ArrowUp':    e.preventDefault(); scrollPlaylist(-1); break;
    case 'ArrowDown':  e.preventDefault(); scrollPlaylist(1); break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      focusable[focusIdx]?.click();
      break;
    case 'Escape':
      searchEl.blur(); setFocus(1); break;
    // TV remote media keys
    case 'MediaPlayPause': btnPlay.click(); break;
    case 'MediaTrackNext': btnNext.click(); break;
    case 'MediaTrackPrevious': btnPrev.click(); break;
  }
});

function scrollPlaylist(dir) {
  // Scroll playlist list up/down without changing focus
  const list = document.getElementById('pl-list');
  list.scrollBy({ top: dir * 60, behavior: 'smooth' });
}

// ── Render ──
function displayList() {
  if (!searchTerm) return playlist;
  return playlist.filter(f => label(f.name).toLowerCase().includes(searchTerm));
}

function renderPlaylist() {
  const list = displayList();
  plCount.textContent = list.length + ' songs';
  plList.innerHTML = '';
  list.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'song-row' + (playlist[currentIdx]?.id === f.id ? ' active' : '');
    row.setAttribute('role','listitem');
    row.innerHTML =
      '<span class="song-num">'+(i+1)+'</span>'+
      '<span class="song-name">'+label(f.name)+'</span>'+
      '<span class="now-dot" aria-hidden="true"></span>';
    row.onclick = () => { currentIdx = playlist.findIndex(p => p.id === f.id); loadAndPlay(); };
    plList.appendChild(row);
  });
}

function scrollActive() {
  const el = plList.querySelector('.active');
  if (el) el.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

function updateNowPlaying() {
  const f = playlist[currentIdx];
  if (!f) return;
  npTitle.textContent = label(f.name);
  npIndex.textContent = (currentIdx+1) + ' of ' + playlist.length;
  document.title = label(f.name) + ' — Radio edas';
}

function updatePlayBtn() {
  btnPlay.innerHTML = isPlaying ? '&#9646;&#9646; Pause' : '&#9654; Play';
  disc.classList.toggle('playing', isPlaying);
}

function loadAndPlay() {
  const f = playlist[currentIdx];
  if (!f) return;
  audio.src = streamUrl(f.id);
  audio.load();
  audio.play().then(() => { isPlaying=true; updatePlayBtn(); requestWakeLock(); }).catch(()=>{});
  updateNowPlaying();
  renderPlaylist();
  scrollActive();
}

// ── Controls ──
btnPlay.onclick = () => {
  if (!audio.src || audio.src === window.location.href) { loadAndPlay(); return; }
  if (isPlaying) { audio.pause(); isPlaying=false; releaseWakeLock(); }
  else { audio.play(); isPlaying=true; requestWakeLock(); }
  updatePlayBtn();
};

btnNext.onclick = () => { currentIdx=(currentIdx+1)%playlist.length; loadAndPlay(); };
btnPrev.onclick = () => {
  if (audio.currentTime > 3) { audio.currentTime=0; return; }
  currentIdx=(currentIdx-1+playlist.length)%playlist.length; loadAndPlay();
};

btnShuffle.onclick = () => {
  shuffleOn = !shuffleOn;
  btnShuffle.classList.toggle('on', shuffleOn);
  const cur = playlist[currentIdx];
  playlist = [...allFiles];
  if (shuffleOn) shuffleArr(playlist);
  currentIdx = playlist.findIndex(f => f.id === cur?.id) || 0;
  renderPlaylist();
};

// ── Progress (visual only — no seek input on TV) ──
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progFill.style.width = pct + '%';
  timeCur.textContent = fmt(audio.currentTime);
  timeTot.textContent = fmt(audio.duration);
});

audio.addEventListener('ended', () => { currentIdx=(currentIdx+1)%playlist.length; loadAndPlay(); });
audio.addEventListener('error', () => { setTimeout(()=>{ currentIdx=(currentIdx+1)%playlist.length; loadAndPlay(); },1200); });

searchEl.addEventListener('input', () => { searchTerm=searchEl.value.toLowerCase(); renderPlaylist(); });

audio.volume = 0.85;

// ── Canvas keep-alive ──
(function(){
  const vid=document.getElementById('video-keepalive');
  const c=document.createElement('canvas'); c.width=2; c.height=2;
  const ctx=c.getContext('2d'); let t=0;
  function draw(){t=(t+1)%256;ctx.fillStyle='rgb('+t+',0,0)';ctx.fillRect(0,0,2,2);}
  draw();
  if(c.captureStream){const s=c.captureStream(1);vid.srcObject=s;vid.play().catch(()=>{});setInterval(draw,1000);}
})();

// ── Wake Lock ──
let wakeLock=null;
async function requestWakeLock(){if(!('wakeLock' in navigator))return;try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
async function releaseWakeLock(){if(wakeLock){try{await wakeLock.release();}catch(e){}wakeLock=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isPlaying)requestWakeLock();});

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/radioplayer/sw.js').catch(()=>{});
  });
}

// ── Boot ──
(async function init(){
  try {
    setLoad(10,'Connecting to library…');
    const files = await fetchAllFiles();
    if (!files.length) { showErr('No audio files found. Check folder sharing settings.'); return; }
    allFiles = files;
    playlist = [...allFiles];
    shuffleArr(playlist);
    setLoad(90,'Almost ready…');
    await new Promise(r=>setTimeout(r,300));
    setLoad(100,"Let's go!");
    await new Promise(r=>setTimeout(r,400));
    loadScreen.classList.add('hidden');
    setTimeout(()=>{loadScreen.style.display='none';},500);
    npTitle.textContent = 'Press play to begin';
    npIndex.textContent = playlist.length + ' songs ready';
    renderPlaylist();
    setFocus(1); // focus Play button on load
  } catch(err) {
    showErr('Error: '+err.message);
  }
})();
</script>
</body>
</html>
