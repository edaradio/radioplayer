<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio — edas.space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F0E8;
    --warm: #EDE6D6;
    --ink: #1A1612;
    --muted: #7A6E62;
    --accent: #C45C2A;
    --rule: rgba(26,22,18,0.12);
  }

  html { font-size: 16px; }

  body {
    background-color: var(--cream);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(196,92,42,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(180,140,80,0.07) 0%, transparent 50%);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }

  /* ── Loading screen ── */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    z-index: 200;
    transition: opacity 0.4s;
  }
  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  .loading-wordmark {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 700;
    color: var(--ink);
  }
  .loading-wordmark span { color: var(--accent); font-style: italic; }

  .loading-bar-wrap {
    width: 220px;
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }
  .loading-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s ease;
  }

  .loading-msg {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  #error-screen {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    z-index: 200;
    padding: 2rem;
    text-align: center;
  }
  #error-screen h2 { font-family: 'Playfair Display', serif; color: var(--accent); }
  #error-screen p { font-size: 0.8rem; color: var(--muted); max-width: 380px; line-height: 1.6; }

  /* ── Header ── */
  header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .wordmark {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--ink);
    line-height: 1;
  }
  .wordmark span { color: var(--accent); font-style: italic; }

  .tagline {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ── Now Playing ── */
  .now-playing {
    border-right: 1px solid var(--rule);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    position: sticky;
    top: 0;
    height: calc(100vh - 85px);
  }

  .np-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .np-disc {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(
      var(--ink) 0deg 10deg, var(--warm) 10deg 25deg,
      var(--ink) 25deg 40deg, var(--warm) 40deg 60deg,
      var(--ink) 60deg 75deg, var(--warm) 75deg 100deg,
      var(--ink) 100deg 115deg, var(--warm) 115deg 140deg,
      var(--ink) 140deg 155deg, var(--warm) 155deg 180deg,
      var(--ink) 180deg 195deg, var(--warm) 195deg 220deg,
      var(--ink) 220deg 235deg, var(--warm) 235deg 260deg,
      var(--ink) 260deg 275deg, var(--warm) 275deg 300deg,
      var(--ink) 300deg 315deg, var(--warm) 315deg 340deg,
      var(--ink) 340deg 355deg, var(--warm) 355deg 360deg
    );
    position: relative;
    max-width: 200px;
    margin: 0 auto;
    animation: spin 8s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 8px 32px rgba(26,22,18,0.18);
  }
  .np-disc.playing { animation-play-state: running; }
  .np-disc::after {
    content: '';
    position: absolute;
    inset: 30%;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .np-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    min-height: 3.6rem;
  }

  .np-index {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.25rem;
  }

  .progress-area { display: flex; flex-direction: column; gap: 0.4rem; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .btn {
    background: none;
    border: 1px solid var(--rule);
    border-radius: 50%;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink);
    font-size: 1rem;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn:hover { background: var(--warm); border-color: var(--muted); }
  .btn:active { transform: scale(0.93); }

  .btn-play {
    width: 54px; height: 54px;
    background: var(--ink);
    border-color: var(--ink);
    color: var(--cream);
    font-size: 1.1rem;
  }
  .btn-play:hover { background: var(--accent); border-color: var(--accent); color: white; }

  .btn-shuffle { font-size: 0.85rem; border-radius: 8px; width: auto; padding: 0 12px; height: 34px; }
  .btn-shuffle.active { background: var(--accent); border-color: var(--accent); color: white; }

  .vol-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.7rem;
    color: var(--muted);
  }

  /* ── Playlist ── */
  .playlist-panel {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 85px);
    overflow: hidden;
  }

  .pl-toolbar {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .search-wrap { position: relative; flex: 1; }

  .search-input {
    width: 100%;
    padding: 0.55rem 0.75rem 0.55rem 2.2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    background: var(--warm);
    border: 1px solid var(--rule);
    border-radius: 6px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.8rem;
    pointer-events: none;
  }

  .pl-count {
    font-size: 0.68rem;
    color: var(--muted);
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  .pl-list {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0;
  }
  .pl-list::-webkit-scrollbar { width: 4px; }
  .pl-list::-webkit-scrollbar-track { background: transparent; }
  .pl-list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 2px; }

  .song-row {
    display: flex;
    align-items: center;
    padding: 0.6rem 2rem;
    cursor: pointer;
    gap: 1rem;
    transition: background 0.1s;
    border-bottom: 1px solid transparent;
  }
  .song-row:hover { background: var(--warm); }
  .song-row.active { background: var(--warm); border-color: var(--rule); }
  .song-row.active .song-name { color: var(--accent); }
  .song-row.active .song-num { color: var(--accent); }

  .song-num {
    font-size: 0.65rem;
    color: var(--muted);
    min-width: 2rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .song-name {
    font-size: 0.82rem;
    color: var(--ink);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .now-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .song-row.active .now-dot { opacity: 1; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .now-playing { height: auto; position: static; border-right: none; border-bottom: 1px solid var(--rule); }
    .playlist-panel { height: 50vh; }
    .np-disc { max-width: 140px; }
  }

  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-wordmark">Radio <span>edas</span></div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-msg" id="loading-msg">Connecting to library…</div>
</div>

<!-- Error Screen -->
<div id="error-screen">
  <h2>Couldn't load library</h2>
  <p id="error-msg">There was a problem connecting to Google Drive. Please check that the folder is shared publicly and the API key is valid.</p>
</div>

<header>
  <div class="wordmark">Radio <span>edas</span></div>
  <div class="tagline">Personal Library</div>
</header>

<div class="layout">
  <aside class="now-playing">
    <div class="np-label">Now playing</div>
    <div class="np-disc" id="disc"></div>
    <div>
      <div class="np-title" id="np-title">Loading…</div>
      <div class="np-index" id="np-index"></div>
    </div>
    <div class="progress-area">
      <input type="range" id="progress" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <div class="time-row">
        <span id="time-cur">0:00</span>
        <span id="time-tot">0:00</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="btn-prev" aria-label="Previous">&#9664;&#9664;</button>
      <button class="btn btn-play" id="btn-play" aria-label="Play/Pause">&#9654;</button>
      <button class="btn" id="btn-next" aria-label="Next">&#9654;&#9654;</button>
      <button class="btn btn-shuffle active" id="btn-shuffle" aria-label="Toggle shuffle">&#x21C4;</button>
    </div>
    <div class="vol-row">
      <span>&#9834;</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
    </div>
  </aside>

  <main class="playlist-panel">
    <div class="pl-toolbar">
      <div class="search-wrap">
        <span class="search-icon">&#128269;</span>
        <input class="search-input" id="search" type="text" placeholder="Search songs…" aria-label="Search songs">
      </div>
      <div class="pl-count" id="pl-count">Loading…</div>
    </div>
    <div class="pl-list" id="pl-list" role="list"></div>
  </main>
</div>

<!-- Hidden video keep-alive (prevents Chrome from suspending the tab) -->
<video id="video-keepalive" muted playsinline loop autoplay
  style="position:fixed;width:1px;height:1px;opacity:0.01;pointer-events:none;top:0;left:0;"
  aria-hidden="true"></video>
<audio id="audio" preload="metadata"></audio>

<script>
// ── Config ──────────────────────────────────────────────
const API_KEY   = 'AIzaSyD6AbH1UySSj6CFTnYtbDeITS6uxPWVOOg';
const FOLDER_ID = '1CU5LwjND6Yt0NIIPX1fo7pbGoUbNbDUC';
// ────────────────────────────────────────────────────────

const loadingScreen = document.getElementById('loading-screen');
const loadingBar    = document.getElementById('loading-bar');
const loadingMsg    = document.getElementById('loading-msg');
const errorScreen   = document.getElementById('error-screen');
const errorMsg      = document.getElementById('error-msg');

function setLoading(pct, msg) {
  loadingBar.style.width = pct + '%';
  loadingMsg.textContent = msg;
}

function showError(msg) {
  loadingScreen.style.display = 'none';
  errorScreen.style.display = 'flex';
  errorMsg.textContent = msg;
}

// Fetch all MP3 files from the Drive folder (handles pagination)
async function fetchAllFiles() {
  let files = [];
  let pageToken = null;
  const base = 'https://www.googleapis.com/drive/v3/files';

  do {
    const params = new URLSearchParams({
      key: API_KEY,
      q: `'${FOLDER_ID}' in parents and mimeType contains 'audio' and trashed = false`,
      fields: 'nextPageToken, files(id, name)',
      pageSize: 1000,
      orderBy: 'name'
    });
    if (pageToken) params.set('pageToken', pageToken);

    const res = await fetch(`${base}?${params}`);
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || 'Drive API error');
    }
    const data = await res.json();
    files = files.concat(data.files || []);
    pageToken = data.nextPageToken || null;
    setLoading(30 + Math.min(files.length / 4, 40), `Found ${files.length} songs…`);
  } while (pageToken);

  return files;
}

function streamUrl(fileId) {
  return `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
}

function label(name) {
  return name.replace(/\.(mp3|MP3|m4a|ogg|flac|wav)$/i, '').replace(/([A-Z])/g, ' $1').trim();
}

function fmt(s) {
  s = Math.floor(s || 0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function shuffleArr(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

// ── Player state ──
let allFiles  = [];   // master list from Drive
let playlist  = [];   // current order (shuffled or not)
let currentIdx = 0;
let isPlaying  = false;
let shuffleOn  = true;
let searchTerm = '';

const audio     = document.getElementById('audio');
const disc      = document.getElementById('disc');
const npTitle   = document.getElementById('np-title');
const npIndex   = document.getElementById('np-index');
const progressEl= document.getElementById('progress');
const timeCur   = document.getElementById('time-cur');
const timeTot   = document.getElementById('time-tot');
const btnPlay   = document.getElementById('btn-play');
const btnPrev   = document.getElementById('btn-prev');
const btnNext   = document.getElementById('btn-next');
const btnShuffle= document.getElementById('btn-shuffle');
const volEl     = document.getElementById('volume');
const plList    = document.getElementById('pl-list');
const plCount   = document.getElementById('pl-count');
const searchEl  = document.getElementById('search');

function displayList() {
  if (!searchTerm) return playlist;
  return playlist.filter(f => label(f.name).toLowerCase().includes(searchTerm));
}

function renderPlaylist() {
  const list = displayList();
  plCount.textContent = list.length + ' songs';
  plList.innerHTML = '';
  list.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'song-row' + (playlist[currentIdx]?.id === f.id ? ' active' : '');
    row.setAttribute('role', 'listitem');
    row.setAttribute('tabindex', '0');
    row.innerHTML =
      '<span class="song-num">' + (i + 1) + '</span>' +
      '<span class="song-name">' + label(f.name) + '</span>' +
      '<span class="now-dot" aria-hidden="true"></span>';
    row.onclick = () => {
      currentIdx = playlist.findIndex(p => p.id === f.id);
      loadAndPlay();
    };
    row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') row.click(); };
    plList.appendChild(row);
  });
}

function scrollActive() {
  const el = plList.querySelector('.active');
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function updateNowPlaying() {
  const f = playlist[currentIdx];
  if (!f) return;
  npTitle.textContent = label(f.name);
  npIndex.textContent = (currentIdx + 1) + ' of ' + playlist.length;
  document.title = label(f.name) + ' — Radio edas';
}

function updatePlayBtn() {
  btnPlay.innerHTML = isPlaying ? '&#9646;&#9646;' : '&#9654;';
  disc.classList.toggle('playing', isPlaying);
}

function loadAndPlay() {
  const f = playlist[currentIdx];
  if (!f) return;
  audio.src = streamUrl(f.id);
  audio.load();
  audio.play().then(() => {
    isPlaying = true;
    updatePlayBtn();
    requestWakeLock();
  }).catch(() => {});
  updateNowPlaying();
  renderPlaylist();
  scrollActive();
}

btnPlay.onclick = () => {
  if (!audio.src || audio.src === window.location.href) { loadAndPlay(); return; }
  if (isPlaying) { audio.pause(); isPlaying = false; releaseWakeLock(); }
  else { audio.play(); isPlaying = true; requestWakeLock(); }
  updatePlayBtn();
};

btnNext.onclick = () => { currentIdx = (currentIdx + 1) % playlist.length; loadAndPlay(); };
btnPrev.onclick = () => {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
  loadAndPlay();
};

btnShuffle.onclick = () => {
  shuffleOn = !shuffleOn;
  btnShuffle.classList.toggle('active', shuffleOn);
  const current = playlist[currentIdx];
  playlist = [...allFiles];
  if (shuffleOn) shuffleArr(playlist);
  currentIdx = playlist.findIndex(f => f.id === current?.id) || 0;
  renderPlaylist();
};

audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  progressEl.value = (audio.currentTime / audio.duration) * 100;
  timeCur.textContent = fmt(audio.currentTime);
  timeTot.textContent = fmt(audio.duration);
});

progressEl.addEventListener('input', () => {
  if (audio.duration) audio.currentTime = (progressEl.value / 100) * audio.duration;
});

volEl.addEventListener('input', () => { audio.volume = parseFloat(volEl.value); });
audio.volume = parseFloat(volEl.value);

audio.addEventListener('ended', () => { currentIdx = (currentIdx + 1) % playlist.length; loadAndPlay(); });
audio.addEventListener('error', () => {
  setTimeout(() => { currentIdx = (currentIdx + 1) % playlist.length; loadAndPlay(); }, 1200);
});

document.addEventListener('keydown', e => {
  if (e.target === searchEl) return;
  if (e.code === 'Space') { e.preventDefault(); btnPlay.click(); }
  if (e.code === 'ArrowRight') btnNext.click();
  if (e.code === 'ArrowLeft') btnPrev.click();
});

searchEl.addEventListener('input', () => {
  searchTerm = searchEl.value.toLowerCase();
  renderPlaylist();
});

// ── Canvas → Video keep-alive ──
(function() {
  const vid = document.getElementById('video-keepalive');
  const canvas = document.createElement('canvas');
  canvas.width = 2; canvas.height = 2;
  const ctx = canvas.getContext('2d');
  let tick = 0;
  function draw() { tick = (tick + 1) % 256; ctx.fillStyle = 'rgb('+tick+',0,0)'; ctx.fillRect(0,0,2,2); }
  draw();
  if (canvas.captureStream) {
    const stream = canvas.captureStream(1);
    vid.srcObject = stream;
    vid.play().catch(() => {});
    setInterval(draw, 1000);
  }
})();

// ── Wake Lock ──
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
async function releaseWakeLock() {
  if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isPlaying) requestWakeLock();
});

// ── Boot: fetch library then launch player ──
(async function init() {
  try {
    setLoading(10, 'Connecting to library…');
    const files = await fetchAllFiles();

    if (!files.length) {
      showError('No audio files found in the Google Drive folder. Make sure the folder is shared as "Anyone with the link" and contains MP3 files.');
      return;
    }

    allFiles = files;
    playlist = [...allFiles];
    shuffleArr(playlist);

    setLoading(90, 'Almost ready…');
    await new Promise(r => setTimeout(r, 300));
    setLoading(100, 'Let\'s go!');
    await new Promise(r => setTimeout(r, 400));

    loadingScreen.classList.add('hidden');
    setTimeout(() => { loadingScreen.style.display = 'none'; }, 500);

    npTitle.textContent = 'Press play to begin';
    npIndex.textContent = playlist.length + ' songs ready';
    renderPlaylist();

  } catch(err) {
    showError('Error: ' + err.message + '. Check that your API key is valid and the folder is publicly shared.');
  }
})();
</script>
</body>
</html>
